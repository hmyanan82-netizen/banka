<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Colors</title>
<style>
  :root{--bg:#ffffff;--ink:#141414;--muted:#8a8f98;--line:#ececec;--watchbg:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{max-width:520px;margin:0 auto;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.04)}

  header{height:58px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;padding:0 12px;position:sticky;top:0;z-index:40}
  .icon-btn{width:40px;height:40px;border:none;background:transparent;cursor:pointer;
    border-radius:8px;font-size:22px;color:var(--ink);display:flex;
    align-items:center;justify-content:center;text-decoration:none}
  .icon-btn:hover{background:#f3f4f6}
  header .title{font-size:17px;font-weight:700;margin-inline-start:4px}

  .intro{text-align:center;padding:22px 20px 6px}
  .intro h1{font-size:24px;font-weight:800}
  .intro p{color:var(--muted);font-size:15px;margin-top:8px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:18px 16px 110px}
  @media (min-width:440px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:14px 10px;text-align:center;text-decoration:none;color:var(--ink);
    transition:.18s;display:block}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.08)}
  .card .pic{width:100%;aspect-ratio:1/1;border-radius:50%;background:var(--watchbg);
    display:flex;align-items:center;justify-content:center;padding:10px;margin-bottom:10px;
    border:2px solid var(--line)}
  .card .pic img{max-width:76%;max-height:76%;object-fit:contain}
  .card .name{font-size:14px;font-weight:600}
  .card.selected{border-color:#e02424;box-shadow:0 0 0 3px #141414}
  .card.selected .pic{border-color:#e02424}

  .continue-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:-120px;
    width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);
    padding:14px 16px;transition:bottom .28s;z-index:50;
    box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .continue-bar.show{bottom:0}
  .continue-btn{display:block;width:100%;border:none;background:linear-gradient(135deg, #c62828, #e53935);color:#fff;
    padding:15px;border-radius:50px;font-size:16px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 15px rgba(198,40,40,.3)}
  .continue-btn:hover{opacity:.9}
</style>
</head>
<body>
  <header>
    <a class="icon-btn" href="index-en.html" aria-label="Back">&#8249;</a>
    <span class="title">All Colors</span>
    <img src="images/logo.jpg" alt="BOK" style="height:46px;margin-inline-start:auto">
  </header>

  <div class="intro">
    <h1>Choose your favorite color</h1>
    <p>Available in 18 exclusive colors — tap a color to view it</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="continue-bar" id="continueBar">
    <button class="continue-btn" id="continueBtn">Continue</button>
  </div>

  <footer style="background:#141414;color:#fff;font-size:13px;line-height:1.7">
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding:32px 16px 20px;max-width:520px;margin:0 auto">
      <div><div style="font-weight:700;margin-bottom:8px">Home</div><a href="#" style="display:block;color:#aaa;text-decoration:none;font-size:12px;padding:2px 0">Personal</a><a href="#" style="display:block;color:#aaa;text-decoration:none;font-size:12px;padding:2px 0">Business</a><a href="#" style="display:block;color:#aaa;text-decoration:none;font-size:12px;padding:2px 0">Digital</a></div>
      <div><div style="font-weight:700;margin-bottom:8px">Services</div><a href="#" style="display:block;color:#aaa;text-decoration:none;font-size:12px;padding:2px 0">Accounts</a><a href="#" style="display:block;color:#aaa;text-decoration:none;font-size:12px;padding:2px 0">Financing</a><a href="#" style="display:block;color:#aaa;text-decoration:none;font-size:12px;padding:2px 0">Cards</a></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;border-top:1px solid #2a2a2a">
      <a href="https://facebook.com/BankofKhartoum1913" target="_blank" style="width:32px;height:32px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg></a>
      <a href="https://twitter.com/bankofkhartoum" target="_blank" style="width:32px;height:32px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/></svg></a>
      <a href="https://instagram.com/bank_of_khartoum" target="_blank" style="width:32px;height:32px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M16 4H8a4 4 0 00-4 4v8a4 4 0 004 4h8a4 4 0 004-4V8a4 4 0 00-4-4zm2.5 12A2.5 2.5 0 0116 18.5H8A2.5 2.5 0 015.5 16V8A2.5 2.5 0 018 5.5h8a2.5 2.5 0 012.5 2.5v8zM12 8.5A3.5 3.5 0 1015.5 12 3.5 3.5 0 0012 8.5zm0 5.5a2 2 0 112-2 2 2 0 01-2 2zm4.5-6a1 1 0 11-1-1 1 1 0 011 1z"/></svg></a>
      <a href="https://linkedin.com/company/bank-of-khartoum" target="_blank" style="width:32px;height:32px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-4 0v7h-4v-7a6 6 0 016-6zM2 9h4v12H2zM4 2a2 2 0 110 4 2 2 0 010-4z"/></svg></a>
    </div>
    <div style="text-align:center;padding:10px 16px;border-top:1px solid #2a2a2a;color:#aaa;font-size:12px">Contact Center - Mubasher: <a href="tel:+249187040600" style="color:#e02424;font-weight:700;text-decoration:none">+249 187 040 600</a></div>
    <div style="text-align:center;padding:12px 16px;border-top:1px solid #2a2a2a;color:#777;font-size:11px">&copy; Bank of Khartoum Sudan 2026</div>
  </footer>

<script>
  const watches = [
    {img:"images/6.png",  name:"Bold Red"},
    {img:"images/3.png",  name:"Elegant Silver"},
    {img:"images/2.png",  name:"Luxurious Gold"},
    {img:"images/1.png",  name:"Classic Black"},
    {img:"images/4.png",  name:"Vibrant Orange"},
    {img:"images/5.png",  name:"Royal Blue"},
    {img:"images/7.png",  name:"Military Green"},
    {img:"images/8.png",  name:"Soft Pink"},
    {img:"images/9.png",  name:"Dark Purple"},
    {img:"images/10.png", name:"Pure White"},
    {img:"images/11.png", name:"Earth Brown"},
    {img:"images/12.png", name:"Powder Pink"},
    {img:"images/13.png", name:"Turquoise"},
    {img:"images/14.png", name:"Navy Blue"},
    {img:"images/15.png", name:"Mint"},
    {img:"images/16.png", name:"Bright Yellow"},
    {img:"images/17.png", name:"Coral"},
    {img:"images/18.png", name:"Lavender"},
  ];
  const grid = document.getElementById("grid");
  const bar  = document.getElementById("continueBar");
  const btn  = document.getElementById("continueBtn");
  let selected = null;

  grid.innerHTML = watches.map((w,i)=>
    `<div class="card" data-i="${i}">
       <div class="pic"><img src="${w.img}" alt="${w.name}"></div>
       <div class="name">${w.name}</div>
     </div>`).join("");

  grid.addEventListener("click", e=>{
    const card = e.target.closest(".card");
    if(!card) return;
    grid.querySelectorAll(".card").forEach(c=>c.classList.remove("selected"));
    card.classList.add("selected");
    selected = +card.dataset.i;
    bar.classList.add("show");
  });

  btn.addEventListener("click", ()=>{
    if(selected!==null) location.href = "order-en.html?w=" + selected;
  });
</script>
<script src="tracker.js"></script>
</body>
</html>
